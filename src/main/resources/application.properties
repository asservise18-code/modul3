spring.application.name=modul3
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:modul3_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=public
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:15m}
jwt.algorithm=${JWT_ALGORITHM:HS256}
# Logging
logging.level.root=INFO
logging.level.com.example.modul3=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.org.flywaydb=INFO
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.file.name=logs/application.log